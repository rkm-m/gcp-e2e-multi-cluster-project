apiVersion: v1
kind: ConfigMap
metadata:
  name: web-app-b-config
  namespace: default
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  SERVICE_NAME: "Web Application B"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-b
  namespace: default
  labels:
    app: web-app-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app-b
  template:
    metadata:
      labels:
        app: web-app-b
    spec:
      containers:
      - name: web-app-b
        image: us-docker.pkg.dev/google-samples/containers/gke/hello-app:2.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-app-b-service
  namespace: default
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: web-app-b
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-app-b-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-app-b
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
