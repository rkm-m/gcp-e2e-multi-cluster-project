apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-config
  namespace: default
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Google Cloud Monitoring
      type: stackdriver
      uid: stackdriver
      isDefault: true
      jsonData:
        authenticationType: gce
        defaultProject: project-a910b7aa-8608-45db-9af
      editable: true
---
